<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | Harmony Lighting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Menu bar ===== -->
  <header class="site-header">
    <a class="logo" href="index.html">
      <img src="images/logo.png" alt="Harmony Lighting">
    </a>

    <button class="nav-toggle" aria-expanded="false" aria-controls="main-nav" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>

    <nav class="main-nav" id="main-nav" aria-label="Main">
      <ul>
        <li><a href="index.html">About Us</a></li>
        <li><a href="service.html">Service</a></li>
        <li><a href="lightingai.html">LightingAI</a></li>
        <li><a href="new-product.html">New Product</a></li>
        <li><a href="our-team.html">Our Team</a></li>
        <li><a href="contact-us.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- ===== Title + description ===== -->
    <section class="page-section gallery-page-intro">
      <h1>Lighting Gallery</h1>
      <p class="intro center">This is the Description of the Gallery</p>
    </section>

    <!-- ===== Grid =====
         Add or remove <button class="tile img-slot"> blocks and matching
         images (gallery/1.jpg, gallery/2.jpg, ...) to change the count.
         Renumber the remaining data-index values (0, 1, 2, ...) if you
         insert or remove one in the middle. -->
    <section class="full-gallery">
      <div class="full-gallery-grid">
        <button type="button" class="tile img-slot" data-index="0">
          <span class="img-label">Image</span>
          <img src="images/gallery/1.jpg" alt="Lighting gallery photo 1">
        </button>
        <button type="button" class="tile img-slot" data-index="1">
          <span class="img-label">Image</span>
          <img src="images/gallery/2.jpg" alt="Lighting gallery photo 2">
        </button>
        <button type="button" class="tile img-slot" data-index="2">
          <span class="img-label">Image</span>
          <img src="images/gallery/3.jpg" alt="Lighting gallery photo 3">
        </button>
        <button type="button" class="tile img-slot" data-index="3">
          <span class="img-label">Image</span>
          <img src="images/gallery/4.jpg" alt="Lighting gallery photo 4">
        </button>
        <button type="button" class="tile img-slot" data-index="4">
          <span class="img-label">Image</span>
          <img src="images/gallery/5.jpg" alt="Lighting gallery photo 5">
        </button>
        <button type="button" class="tile img-slot" data-index="5">
          <span class="img-label">Image</span>
          <img src="images/gallery/6.jpg" alt="Lighting gallery photo 6">
        </button>
        <button type="button" class="tile img-slot" data-index="6">
          <span class="img-label">Image</span>
          <img src="images/gallery/7.jpg" alt="Lighting gallery photo 7">
        </button>
        <button type="button" class="tile img-slot" data-index="7">
          <span class="img-label">Image</span>
          <img src="images/gallery/8.jpg" alt="Lighting gallery photo 8">
        </button>
        <button type="button" class="tile img-slot" data-index="8">
          <span class="img-label">Image</span>
          <img src="images/gallery/9.jpg" alt="Lighting gallery photo 9">
        </button>
        <button type="button" class="tile img-slot" data-index="9">
          <span class="img-label">Image</span>
          <img src="images/gallery/10.jpg" alt="Lighting gallery photo 10">
        </button>
        <button type="button" class="tile img-slot" data-index="10">
          <span class="img-label">Image</span>
          <img src="images/gallery/11.jpg" alt="Lighting gallery photo 11">
        </button>
        <button type="button" class="tile img-slot" data-index="11">
          <span class="img-label">Image</span>
          <img src="images/gallery/12.jpg" alt="Lighting gallery photo 12">
        </button>
        <button type="button" class="tile img-slot" data-index="12">
          <span class="img-label">Image</span>
          <img src="images/gallery/13.jpg" alt="Lighting gallery photo 13">
        </button>
        <button type="button" class="tile img-slot" data-index="13">
          <span class="img-label">Image</span>
          <img src="images/gallery/14.jpg" alt="Lighting gallery photo 14">
        </button>
        <button type="button" class="tile img-slot" data-index="14">
          <span class="img-label">Image</span>
          <img src="images/gallery/15.jpg" alt="Lighting gallery photo 15">
        </button>
      </div>
    </section>

    <!-- ===== Lightbox =====
         Opens when a gallery photo is clicked; closes on the cross,
         a click outside the photo, or the Escape key. -->
    <div class="lightbox" id="lightbox" hidden>
      <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
      <img class="lightbox-image" id="lightbox-image" src="" alt="">
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
