<body>

  <!-- ===== Menu bar ===== -->
  <header class="site-header">

      <h1>Our Team</h1>

        <li class="team-member">
          <div class="avatar img-slot">
            <span class="img-label"><svg class="avatar-placeholder" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></span>

          <p class="member-name">Name</p>
          <p class="member-role">Post</p>
